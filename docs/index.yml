- id: ArchiveToolkit
  name: Archive Toolkit
  version: 0.2.3
  date: '2026-10-27 12:11:49'
  path: https://allisless0.gitlab.io/stash-plugins/main/ArchiveToolkit.zip
  sha256: 7f20fb6a39f32d91210af77d93a5fba6892d26caa880281a673f1b8fa3379a29
  metadata:
    description: 'Which organized scenes are in their final archive format, and moves
      them there: a smarter Librarian. A scan (a Stash task that only reads, a page
      of scenes at a time) puts every organized scene through the gate (a stash ID;
      HEVC or AV1 video with AAC, Opus or MP3 audio in MP4, MKV or M4V; not changed
      in the last 30 minutes; no transcoder''s temp file beside it; studio, date and
      title; a target path that fits 240 characters as Windows sees it and is free)
      and sorts them into Ready, Waiting, Needs a look and Done. Archive moves the
      Ready scenes you tick through Stash''s own move, their funscripts, subtitles
      and pictures with them, each checked again right before and after its move,
      logged with Undo. It names files with Librarian''s pattern, smarter by default,
      and shows which library folders share a mount and orphaned sidecars. Needs Python
      3 on the Stash server and Suite Data for archiving.'
