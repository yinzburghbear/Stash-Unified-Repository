      streaks, a year calendar, watch time, what works for you by performer and scene
      traits, your queue), Actions (with the toolkit plugins, a library to-do list:
      what each one''s last scan found, a button to scan them all and their one-click
      jobs; a duplicate cleaner that keeps the best copy for a 1080p target (picture
      first, then codec, length, frame rate) and moves markers, O''s, plays, rating
      and tags over before removing the rest; files to re-encode or upgrade; space
      hogs; metadata fixes), Library (size, records, timelines), Files and quality
      (codecs, resolutions, bitrates, where the space goes), Metadata health (a grade,
      what is missing, what is probably wrong) and Collection (growth, tags, studio
      networks, countries, pairs). With the Movies Toolkit plugin, a Movies tab too
      (your movies by plays, gaps in their scene numbers, how far you are into each,
      what their details lack, chapters). Every bar and row leads into Stash. Opens
      at once and reads only what changed since the last visit. With the Lockdown
      plugin, the You tab shows your runs too; with the Slideshow plugin, your time
      with pictures. Replaces O Stats and Stats Enhancer.'
