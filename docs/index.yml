- id: Slideshow
  name: Slideshow
  version: 0.7.1
  date: '2026-10-25 23:16:21'
  path: https://allisless0.gitlab.io/stash-plugins/main/Slideshow.zip
  sha256: 52d4b1f531485dab17204564a8f096e714adb29cf4cfdecf889955984670a459
  metadata:
    description: 'Plays pictures full screen, one at a time, on a timer (3, 5, 8 or
      12 seconds, or by hand) with a quick dissolve between them: a Play pictures
      button under a performer''s, studio''s, tag''s or gallery''s name plays all
      of theirs, the same button in the toolbar of image and gallery lists plays exactly
      what the list shows, and a play mark on gallery cards plays that gallery. Shuffle,
      in order (gallery by gallery) or unseen first. Clean while it plays: move the
      mouse or tap to see the controls, who is in the picture and the gallery. GIFs
      and clips play through before it moves on. Remembers which pictures you have
      seen, on every device, and shows on its buttons how many you have seen ("340
      of 1,625 seen") and how many are new. A slow pan and zoom on photos while they
      show (on by default, K or the menu to turn it off). Arrow keys or swipe to move,
      Space to pause, F for full screen, Esc to close. With Lockdown, plays what a
      run is locked to; with Insights, your time with pictures shows on the Stats
      page.'
