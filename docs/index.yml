- id: RatingsToolkit
  name: Ratings Toolkit
  version: 0.2.2
  date: '2026-10-25 23:16:21'
  path: https://allisless0.gitlab.io/stash-plugins/main/RatingsToolkit.zip
  sha256: 74793b17a6810e13f811cbd2f7b16fcb2b7043773e620d1b2c07da004212fa1a
  metadata:
    description: 'Rate performers on a few criteria of your own (Face, Body, Passion,
      Charisma, Consistency, Range by default; groups, weights and what each level
      means are yours to change), 1 to 5 against the rest of your library, with "not
      sure" when you are not. The overall score goes to Stash''s own rating, so sorting
      and filters keep working. R on a performer''s page or over a performer card
      (with Quick Tools), Shift+R in the player for the performer on screen. Shows
      what your watching says, who else you gave the same score, and when a rating
      has gone stale. Compare mode: two performers side by side, pick the one higher
      on a criterion (arrow keys or a tap); rounds mostly among performers with the
      same score, and suggested changes at the end to accept or skip. A Rate queue
      of unrated and stale performers, a criteria editor that keeps old scores attached
      when you rename, split or merge, a one-time import from the Advanced Rating
      plugin''s star tags (nothing deleted), and History with undo. Scores are kept
      by Suite Data when it is installed.'
