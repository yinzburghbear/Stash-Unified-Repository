- id: tagsPanel
  name: Tags Panel
  metadata:
    description: Replaces the tag display with an interactive badge panel on Scene,
      Gallery, and Image pages. Attached tags are bright; unattached are dim. Click
      to toggle instantly.
  version: 0.1.0-81dc44c
  date: 2026-03-08 15:14:11
  path: https://kokkeng1.github.io/stash_plugin_custom/tagsPanel.zip
