- id: SceneToolkit
  name: Scenes Toolkit
  version: 0.14.0
  date: '2026-10-26 23:08:03'
  path: https://allisless0.gitlab.io/stash-plugins/main/SceneToolkit.zip
  sha256: d3c11742f464371272405431a282659ddaac38594546b311b13ba06030d49b48
  metadata:
    description: 'Finds details for scenes without a match: by fingerprint first,
      then by what the file name says. Scan in the background, then review: the ready
      ones save in one go (in the background or in the tab), the rest wait for a fast
      one-scene-at-a-time review. A Performers tab shows how complete each performer''s
      scenes and catalog are, and a Catalog tab on performer pages shows what a stash-box
      lists that you do not have (with Performers Toolkit installed, both move there
      and the Catalog is drawn inside its tab). A Fill tab adds the performers a linked
      scene''s stash-box record has and the scene lacks (and, when asked, makes the
      missing ones of the genders you tick); an Update tab finds linked scenes whose
      stash-box record changed and applies what you tick. Fills only empty fields;
      after a save that links a scene to a stash-box, its fingerprints go to that
      stash-box, as Stash''s own tagger sends them. Everything can be undone.'
