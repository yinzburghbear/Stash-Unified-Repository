- id: TagAtlas
  name: Tags Toolkit
  version: 1.7.1
  date: '2026-10-25 23:16:21'
  path: https://allisless0.gitlab.io/stash-plugins/main/TagAtlas.zip
  sha256: bbbeff2f2f2e6ceb1455525944bee0f80f4be3a85639f3853a9ed2963d0240dd
  metadata:
    description: 'Makes a messy tag list usable again. A background scan asks StashDB
      what each tag means; then you fill in the sure ones in one go (description,
      aliases, StashDB link, and a place under People, Action or Scene and StashDB''s
      categories, so Stash''s own hover card explains any tag) and review the rest
      one at a time: tags StashDB knows only by another name, and possible duplicates
      to merge. Tags on nothing are parked under Unused. Clean up lists tags that
      do not tell scenes apart: technical ones (frame rates, "4K Available"), tags
      about men, nationalities, age numbers, gendered variants, release info, vague
      and duplicate ones. A tree view shows every tag in its place, with marks and
      merges you set up by hand. Tag previews saved as video (WebM) play instead of
      showing broken. Nothing changes without a look or your go-ahead, and every change
      can be undone. Opens from a button on the Tags page.'
- id: TasksToolkit
  name: Tasks Toolkit
  version: 0.6.4
  date: '2026-10-30 02:24:39'
  path: https://allisless0.gitlab.io/stash-plugins/main/TasksToolkit.zip
  sha256: f0e84bb4d55ea68ffe06906753be2de52c6a56204f9dff8fe4d14a7685be1819
  metadata:
    description: 'Keeps Stash maintained for you. Turn on Autopilot (the Auto switch
      beside the Tasks button) and Stash scans new files, makes covers and phashes,
      identifies by fingerprint (empty fields only), auto tags, runs the toolkits''
      scans, archives and backs up, one task at a time. Turn it off and Stash is yours:
      running scans stop and pick up later. The Tasks page shows what your library
      needs, routines on a timer, and what is running, with history. Nothing that
      changes your edits runs by itself.'
